name: Bug report / 问题反馈
description: Report a reproducible problem with the application.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Application version / 软件版本
      placeholder: v1.1.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Laptop model and Windows version / 机型与系统版本
      description: Do not include serial numbers, Windows product keys, or account information.
      placeholder: HASEE Computer CNP6S, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result / 复现步骤与预期、实际结果
      description: Include which mode each fan used and whether curves/manual controls were linked.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error text or screenshot / 错误信息或截图
      description: Remove personal paths, serial numbers and other personal information before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting / 提交前检查
      options:
        - label: I am not running another EC/fan control tool at the same time.
        - label: I understand an unverified model is not supported merely because it uses a Clevo chassis.
